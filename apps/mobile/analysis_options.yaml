# Configuración del analizador de Cambiami.
#
# Base: `very_good_analysis` (decisión G-02). Las reglas adicionales se
# justifican aquí; no se silencian lints sin motivo.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - linux/**

linter:
  rules:
    # La app es interna: no expone una API pública para terceros.
    public_member_api_docs: false
    # `const new(...)` es sintaxis nueva de Dart 3.14, pero `const MyApp(...)`
    # se lee mejor en el código del equipo.
    unnecessary_type_name_in_constructor: false
